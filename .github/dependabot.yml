# Dependabot configuration.
#
# Purpose: batch Dependabot *security* updates into one grouped PR per
# ecosystem instead of one PR per vulnerable package.
#
# open-pull-requests-limit: 0 keeps regular version updates switched OFF for
# each ecosystem; only security updates are produced, and those are grouped
# by the "groups" block (applies-to: security-updates).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
